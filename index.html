<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hare Krishna Nature Farm | ISKCON Botanical Encyclopedia</title>
    
    <!-- Professional Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">

    
    <style>
        /* Agricultural / Earthy Nature Palette */
        :root {
            --bg-color: #f5f2eb; /* Warm parchment/canvas */
            --primary-dark: #3b2f2f; /* Deep soil brown */
            --primary-green: #375236; /* Crop/Forest green */
            --accent-earth: #8c5a35; /* Terracotta/Wood */
            --light-earth: #e6dfd3; /* Light straw/oatmeal */
            --text-main: #332c27; /* Dark earth for text */
            --text-muted: #665d52; /* Muted brown-grey */
            --white: #ffffff;
            --card-border: #d6cfc1; /* Sturdy rustic border */
            --shadow-soft: 0 4px 6px -1px rgba(59, 47, 47, 0.08);
            --shadow-hover: 0 10px 15px -3px rgba(59, 47, 47, 0.12);
        }

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            /* Added subtle texture-like feel with a flat clean warm tone */
        }

        /* Removed blurry orbs for a more grounded, physical farm look */

        /* Premium Header */
        header {
            padding: 5rem 2rem 4rem;
            text-align: center;
            position: relative;
            z-index: 10;
            border-bottom: 1px solid var(--card-border);
            background: #faf8f5;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            color: var(--primary-dark);
            line-height: 1.1;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 500;
            color: var(--accent-earth);
            margin-bottom: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Search Bar Area */
        .search-wrapper {
            position: relative;
            max-width: 650px;
            margin: 0 auto;
        }

        .search-icon {
            position: absolute;
            left: 1.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-earth);
            width: 22px;
            height: 22px;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        #search-input {
            width: 100%;
            padding: 1.5rem 2rem 1.5rem 4.5rem;
            font-size: 1.1rem;
            border: 2px solid var(--card-border);
            border-radius: 8px; /* More rectangular, like a sturdy crate */
            background: var(--white);
            color: var(--primary-dark);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }

        #search-input:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 4px rgba(55, 82, 54, 0.1);
        }

        #search-input::placeholder {
            color: var(--text-muted);
            font-weight: 300;
        }

        #search-input:focus + .search-icon {
            color: var(--primary-green);
        }

        /* Category Filters UI */
        .categories-wrapper {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 2.5rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .category-btn {
            padding: 0.6rem 1.2rem;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 4px; /* Tag-like shape */
            color: var(--text-muted);
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-btn:hover {
            background: var(--white);
            border-color: var(--accent-earth);
            color: var(--accent-earth);
            transform: translateY(-1px);
        }

        .category-btn.active {
            background: var(--primary-green);
            color: var(--white);
            border-color: var(--primary-green);
            box-shadow: var(--shadow-soft);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 3rem 1rem;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
            z-index: 5;
            position: relative;
        }

        /* Loader */
        .status-state {
            text-align: center;
            padding: 5rem 2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 3px solid var(--light-earth);
            border-top-color: var(--primary-green);
            border-radius: 50%;
            animation: rotate 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        /* Plants Grid Layout */
        .plants-grid {
            display: grid;
            gap: 1.5rem; 
            grid-template-columns: repeat(2, 1fr); 
        }

        @media (min-width: 1024px) {
            .plants-grid {
                gap: 2.5rem;
                grid-template-columns: repeat(4, 1fr); 
            }
        }

        /* Agricultural Plant Card (Seed Packet style) */
        .card {
            background: var(--white);
            border-radius: 8px;
            border: 1px solid var(--card-border);
            border-bottom: 4px solid var(--primary-green);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-soft);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent-earth);
            border-bottom-color: var(--accent-earth);
        }

        .card-img-wrapper {
            width: 100%;
            height: 180px; 
            overflow: hidden;
            position: relative;
            background: var(--light-earth);
            border-bottom: 1px solid var(--card-border);
        }

        @media (min-width: 768px) {
            .card-img-wrapper { height: 240px; } 
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 1.5rem 1.2rem; 
            position: relative;
            background: var(--white);
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        @media (min-width: 768px) {
            .card-content { padding: 1.8rem 1.5rem; }
        }

        .plant-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem; 
            color: var(--primary-dark);
            margin-bottom: 0.2rem;
            line-height: 1.2;
        }

        .plant-botanical {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.9rem; 
            margin-bottom: 1.5rem;
            border-bottom: 1px dashed var(--card-border);
            padding-bottom: 0.8rem;
        }

        @media (min-width: 768px) {
            .plant-name { font-size: 1.5rem; margin-bottom: 0.4rem; }
            .plant-botanical { font-size: 1rem; }
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .view-details {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-earth);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .view-details svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .card:hover .view-details svg {
            transform: translateX(4px);
        }

        .plant-price {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-dark);
            background: var(--light-earth);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            border: 1px solid var(--card-border);
        }

        /* No Results Message */
        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 4rem;
            background: var(--white);
            border: 1px dashed var(--card-border);
            border-radius: 8px;
        }

        .no-results h3 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--primary-dark);
            margin-bottom: 1rem;
        }

        .no-results p {
            color: var(--text-muted);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 2rem;
            margin-top: auto;
            color: var(--text-muted);
            font-size: 0.95rem;
            border-top: 1px solid var(--card-border);
            background: #faf8f5;
        }

        footer span {
            color: #d32f2f;
            font-size: 1.2rem;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <h1>Hare Krishna Nature Farm</h1>
            <div class="subtitle">ISKCON Botanical Encyclopedia</div>
            
            <div class="search-wrapper">
                <input type="text" id="search-input" placeholder="Search by name, botanical or vernacular name...">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>

            <!-- Category Filters -->
            <div class="categories-wrapper">
                <button class="category-btn active" data-category="All">All Plants</button>
                <button class="category-btn" data-category="Tropical">Tropical</button>
                <button class="category-btn" data-category="Herbs">Herbs</button>
                <button class="category-btn" data-category="Aromatic Plants">Aromatic Plants</button>
                <button class="category-btn" data-category="Nursery">Nursery</button>
                <button class="category-btn" data-category="Flower Plants">Flower Plants</button>
            </div>
            
        </div>
    </header>

    <main>
        <div id="loader" class="status-state">
            <div class="spinner"></div>
            <h2 style="font-family: 'Playfair Display', serif; color: var(--primary-dark); font-size: 2rem;">Curating Flora...</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Accessing the botanical archives.</p>
        </div>
        <div id="plants-grid" class="plants-grid">
            <!-- Cards will be injected here via JS -->
        </div>
    </main>

    <footer>
        Made with <span>❤️</span> for Hare Krishna Nature Farm
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('search-input');
            const plantsGrid = document.getElementById('plants-grid');
            const loader = document.getElementById('loader');
            const categoryBtns = document.querySelectorAll('.category-btn');
            
            let allPlants = [];
            let currentCategory = 'All'; // Track current category
            let searchQuery = '';        // Track current search

            // Updated placeholder with earthy color palette
            const placeholderImg = "data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22400%22 viewBox=%220 0 600 400%22%3E%3Crect width=%22600%22 height=%22400%22 fill=%22%23e6dfd3%22/%3E%3Cpath d=%22M300 120c-44.1 0-80 35.9-80 80s35.9 80 80 80 80-35.9 80-80-35.9-80-80-80zm0 128c-26.5 0-48-21.5-48-48s21.5-48 48-48 48 21.5 48 48-21.5 48-48 48z%22 fill=%22%238c5a35%22/%3E%3Cpath d=%22M300 160c-22 0-40 18-40 40s18 40 40 40 40-18 40-40-18-40-40-40z%22 fill=%22%23375236%22/%3E%3C/svg%3E";

            // Fetch JSON Data
            async function fetchPlants() {
                try {
                    await new Promise(resolve => setTimeout(resolve, 600)); 
                    
                    const response = await fetch('plants.json');
                    if (!response.ok) throw new Error('Network response was not ok');
                    
                    const data = await response.json();
                    allPlants = data.plants || data; // Handle both `{plants: [...]}` and `[...]` structures
                    
                    loader.style.display = 'none';
                    
                    // Render initially with no filters
                    filterPlants();
                    
                } catch (error) {
                    console.error("Error loading plant data:", error);
                    
                    let errorMessage = "Failed to load 'plants.json'. Please ensure it exists.";
                    if (window.location.protocol === 'file:') {
                        errorMessage = "<b>Browser Security Block:</b> You cannot read JSON files by double-clicking the HTML file. You MUST open this site using a local server (like the Live Server extension in VS Code).";
                    }

                    loader.innerHTML = `
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#d32f2f" stroke-width="1.5" style="margin: 0 auto 1.5rem;"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                        <h2 style="font-family: 'Playfair Display', serif; color: #d32f2f; font-size: 2rem;">Archive Unavailable</h2>
                        <p style="color: var(--text-muted); margin-top: 0.5rem; line-height: 1.6;">${errorMessage}</p>`;
                }
            }

            // Render Cards to the DOM
            function renderCards(plants) {
                plantsGrid.innerHTML = ''; // Clear grid

                if (plants.length === 0) {
                    plantsGrid.innerHTML = `
                        <div class="no-results">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--card-border)" stroke-width="1.5" style="margin-bottom: 1rem;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <h3>No Flora Found</h3>
                            <p>We couldn't find any botanical records matching your search or category filter.</p>
                        </div>`;
                    return;
                }

                plants.forEach((plant, index) => {
                    const card = document.createElement('a');
                    card.href = `plantdetails.html?id=${plant.id}`;
                    card.className = 'card';
                    card.style.animationDelay = `${index * 0.1}s`;

                    const imageSrc = plant.image && plant.image.trim() !== '' ? plant.image : placeholderImg;

                    card.innerHTML = `
                        <div class="card-img-wrapper">
                            <img src="${imageSrc}" alt="${plant.name}" onerror="this.onerror=null;this.src='${placeholderImg}';">
                        </div>
                        <div class="card-content">
                            <h2 class="plant-name">${plant.name}</h2>
                            <div class="plant-botanical">${plant.botanicalName || 'Botanical name unknown'}</div>
                            
                            <div class="card-footer">
                                <span class="view-details">
                                    Explore 
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                                </span>
                                <span class="plant-price">${plant.price || 'N/A'}</span>
                            </div>
                        </div>
                    `;
                    
                    plantsGrid.appendChild(card);
                });
            }

            // Master Filter Function
            function filterPlants() {
                const filteredPlants = allPlants.filter(plant => {
                    // 1. Check Search Query
                    const nameMatch = plant.name?.toLowerCase().includes(searchQuery);
                    const botanicalMatch = plant.botanicalName?.toLowerCase().includes(searchQuery);
                    const vernacularMatch = plant.vernacularName?.toLowerCase().includes(searchQuery);
                    const matchesSearch = nameMatch || botanicalMatch || vernacularMatch;

                    // 2. Check Category 
                    let matchesCategory = true;
                    if (currentCategory !== 'All') {
                        matchesCategory = plant.category === currentCategory;
                    }

                    // Must match BOTH search query AND selected category
                    return matchesSearch && matchesCategory;
                });

                renderCards(filteredPlants);
            }

            // Event Listener: Search Bar
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                filterPlants();
            });

            // Event Listener: Category Buttons
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove 'active' class from all buttons
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    
                    // Add 'active' class to clicked button
                    btn.classList.add('active');
                    
                    // Update current category and trigger filter
                    currentCategory = btn.getAttribute('data-category');
                    filterPlants();
                });
            });

            // Initialize
            fetchPlants();
        });
    </script>
</body>
</html>
